[package]
name         = "karyozip"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85"

[[bin]]
name = "karyozip"
path = "src/main.rs"

[dependencies]
# The latest zstd-sys, and it bundles exactly the 1.5.7 the C links. The
# pin is deliberate: zstd does not promise identical output across its own
# releases, so it is what makes byte-identity with c/ testable at all.
# bindgen is a default feature and needs libclang, which a cluster node does
# not have; the pregenerated bindings are the same API. legacy (pre-1.0
# frames) and the dictionary builder are not used either.
zstd-sys = { version = "=2.0.16", default-features = false }
clap     = { version = "4.6.6", features = ["derive"] }
# The parser is half of encode, and this is the SIMD byte search the C gets
# from glibc's memchr for free.
memchr   = "2.8.3"
# The real tracks are .bed.gz, so every reader inflates on the fly. zlib-rs
# is the Rust rewrite of zlib: no system library, and far faster at inflate
# than the miniz_oxide default.
flate2   = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rayon    = "1.12.0"
# The LZMA candidate. It links the system liblzma, the one c/ links, so the
# two write the same bytes; the settings are pinned in ffi::lzma_filt.
lzma-sys = "0.1.20"

[build-dependencies]
cc = "1.4.5"

[profile.release]
opt-level = 3
debug     = true
# One codegen unit and fat LTO: the hot loops are small and cross-module
# (reader::step, smooth_one, the hierarchy tables), and the C sees all of
# them in one translation unit.
lto            = "fat"
codegen-units  = 1
